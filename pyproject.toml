[project]
name = "dag-test"
version = "0.1.0"
description = "Local development and testing for Airflow DAG task logic"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Install when you want to parse or dry-run Airflow DAG modules locally:
#   uv sync --extra airflow
airflow = [
    "apache-airflow>=2.10,<3",
]

[project.scripts]
dag-test = "dag_test.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"tasks" = "tasks"
"workflows" = "workflows"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
